name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secure-file-vault:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d --name vault -p 8000:8000 \
            -e SECRET_KEY=ci-only-not-a-real-secret \
            secure-file-vault:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/ && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","email":"ci@example.com","password":"ci-password"}'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password"}' | python3 -c 'import sys, json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://127.0.0.1:8000/me -H "Authorization: Bearer $TOKEN"

      - name: Container logs
        if: failure()
        run: docker logs vault

  # Deploys to AWS after every other job passes. Only runs for pushes to main, and is skipped
  # until the AWS settings from infra/README.md have been added as repository variables.
  deploy:
    needs: [test, frontend, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job prove its identity to AWS (OIDC) instead of using stored keys
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        env:
          REPO: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          docker build -t "$REPO:${{ github.sha }}" -t "$REPO:latest" .
          docker push --all-tags "$REPO"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api # same address as the frontend; CloudFront routes /api to the server
        run: |
          npm ci
          npm run build

      - name: Publish the frontend
        run: |
          aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

      - name: Restart the API on the server
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/usr/local/bin/deploy-vault"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Deploy script finished with status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
            exit 1
          fi

      - name: Check the live site
        run: |
          for i in $(seq 1 15); do
            curl -fsS "${{ vars.SITE_URL }}/api/" && exit 0
            sleep 4
          done
          exit 1
