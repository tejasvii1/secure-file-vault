name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secure-file-vault:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d --name vault -p 8000:8000 \
            -e SECRET_KEY=ci-only-not-a-real-secret \
            secure-file-vault:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/ && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","email":"ci@example.com","password":"ci-password"}'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password"}' | python3 -c 'import sys, json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://127.0.0.1:8000/me -H "Authorization: Bearer $TOKEN"

      - name: Container logs
        if: failure()
        run: docker logs vault
